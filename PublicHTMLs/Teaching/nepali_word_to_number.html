<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>नेपाली शब्दबाट अंक (Nepali Word to Number 0-100)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --accent: #ec4899;
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
      --bg: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 50%, #fef3c7 100%);
      --card-bg: #ffffff;
      --text: #1e1b4b;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Mukta', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: var(--text);
      overflow-x: hidden;
    }

    .app-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 16px 36px rgba(79, 70, 229, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 3px solid #ffffff;
      position: relative;
    }

    /* Top Minimal Score Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .score-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #3730a3;
      background: #eef2ff;
      border: 1.5px solid #c7d2fe;
      padding: 4px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speak-top-btn {
      background: #fdf2f8;
      border: 1.5px solid #fbcfe8;
      color: #be185d;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .speak-top-btn:active {
      transform: scale(0.95);
    }

    /* Progress Line */
    .progress-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #ec4899);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Word Question Hero Card */
    .hero-card {
      width: 100%;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 2.5px solid #e0e7ff;
      border-radius: 20px;
      padding: 22px 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
    }

    .word-prompt-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .hero-nepali-word {
      font-size: 2.8rem;
      font-weight: 900;
      color: #4f46e5;
      line-height: 1.15;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-shadow: 0 2px 6px rgba(79, 70, 229, 0.15);
    }

    .hero-phonetic-hint {
      font-size: 1.15rem;
      font-weight: 700;
      color: #db2777;
      min-height: 24px;
    }

    /* Interactive Input Area (No MCQ) */
    .input-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .digit-input-box {
      width: 100%;
      max-width: 260px;
      height: 64px;
      background: #ffffff;
      border: 3.5px solid #6366f1;
      border-radius: 18px;
      font-size: 2.5rem;
      font-weight: 900;
      text-align: center;
      color: #1e1b4b;
      caret-color: #ec4899;
      outline: none;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.12);
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .digit-input-box:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2);
    }

    .digit-input-box.correct {
      border-color: var(--correct) !important;
      background: var(--correct-bg) !important;
      color: #15803d !important;
    }

    .digit-input-box.wrong {
      border-color: var(--wrong) !important;
      background: var(--wrong-bg) !important;
      color: #991b1b !important;
      animation: shake 0.4s ease;
    }

    /* Submit Check Button */
    .btn-check {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #047857;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
      transition: all 0.12s ease;
      font-family: inherit;
    }

    .btn-check:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    .btn-check:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Explanation & Correction Card */
    .explanation-card {
      display: none;
      width: 100%;
      background: #fff1f2;
      border: 2px solid #fda4af;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      text-align: center;
      animation: popIn 0.25s ease;
    }

    .explanation-card.show {
      display: block;
    }

    .explanation-main {
      font-size: 1.35rem;
      font-weight: 900;
      color: #be123c;
      margin-bottom: 4px;
    }

    .explanation-sub {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
    }

    /* Next Question Action */
    .btn-next {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #3730a3;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      animation: popIn 0.25s ease;
      font-family: inherit;
    }

    .btn-next.show {
      display: flex;
    }

    .btn-next:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    /* Collapsible Bottom Drawer */
    .settings-drawer {
      width: 100%;
      border-radius: 16px;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      overflow: hidden;
      margin-top: 4px;
    }

    .settings-summary {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #4f46e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style: none;
    }

    .settings-summary::-webkit-details-marker {
      display: none;
    }

    .settings-drawer[open] {
      border-style: solid;
      border-color: #c7d2fe;
      background: #ffffff;
    }

    .drawer-content {
      padding: 6px 14px 14px;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 8px 0 5px;
    }

    .chips-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .chip-btn {
      flex: 1;
      min-width: 72px;
      padding: 8px 4px;
      font-size: 0.85rem;
      font-weight: 800;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #64748b;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
      font-family: inherit;
    }

    .chip-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #3730a3;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
    }

    .tools-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
      margin-top: 6px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      font-family: inherit;
    }

    .tool-btn:hover {
      background: #f1f5f9;
      color: #1e1b4b;
    }

    /* Celebration Screen */
    .celebration-view {
      display: none;
      text-align: center;
      padding: 24px 8px;
      width: 100%;
    }

    .celebration-view.active {
      display: block;
      animation: popIn 0.35s ease;
    }

    .trophy-emoji {
      font-size: 4.2rem;
      margin-bottom: 12px;
      animation: bounce 1s infinite alternate;
    }

    .celebration-title {
      font-size: 1.9rem;
      font-weight: 900;
      color: #3730a3;
      margin-bottom: 6px;
    }

    .celebration-score {
      display: inline-block;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      color: #b45309;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 1.5rem;
      font-weight: 900;
      margin: 16px 0;
    }

    .restart-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #3730a3;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="app-card">

    <!-- Active Game Stage -->
    <div id="game-stage" style="width: 100%;">

      <!-- Top Score Bar -->
      <div class="top-bar">
        <div class="score-badge" id="score-badge">⭐ ० / १०</div>
        <button class="speak-top-btn" id="listen-btn" title="Listen to pronunciation">
          <span>🗣️ सुनौं</span>
        </button>
      </div>

      <!-- Thin Progress Bar -->
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- Hero Word Card (Question: Number in words) -->
      <div class="hero-card">
        <div class="word-prompt-label">शब्दलाई अंकमा लेख्नुहोस् (Type the Digits)</div>
        <div class="hero-nepali-word" id="hero-word">पच्चिस</div>
        <div class="hero-phonetic-hint" id="hero-hint">(Pachchis)</div>
      </div>

      <!-- Direct Numeric Input (No MCQ) -->
      <div class="input-section">
        <input type="text"
               inputmode="numeric"
               pattern="[0-9०-९]*"
               maxlength="3"
               class="digit-input-box"
               id="digit-input"
               placeholder="?"
               autocomplete="off"
               autofocus />

        <!-- Check Answer Button -->
        <button class="btn-check" id="btn-check">
          <span>✓ Check Answer</span>
        </button>
      </div>

      <!-- Explanation Card (Shown on Wrong Answer) -->
      <div class="explanation-card" id="explanation-card">
        <div class="explanation-main" id="explanation-main"></div>
        <div class="explanation-sub" id="explanation-sub"></div>
      </div>

      <!-- Next Button on Error Review -->
      <button class="btn-next" id="btn-next">
        <span>अर्को प्रश्न (Next Question) ➔</span>
      </button>

      <!-- Collapsible Settings Drawer at Bottom -->
      <details class="settings-drawer" id="settings-drawer">
        <summary class="settings-summary">
          <span>⚙️ Options (विकल्प)</span>
          <span>▾</span>
        </summary>
        <div class="drawer-content">

          <div class="section-label">दायरा (Range)</div>
          <div class="chips-row">
            <button class="chip-btn active" data-range="20">० - २०</button>
            <button class="chip-btn" data-range="50">० - ५०</button>
            <button class="chip-btn" data-range="100">० - १००</button>
            <button class="chip-btn" data-range="tens">दशक (१०-१००)</button>
          </div>

          <div class="section-label">सङ्केत (Phonetic Hint)</div>
          <div class="chips-row">
            <button class="chip-btn active" id="hint-toggle">संकेत On (Pachchis)</button>
          </div>

          <div class="tools-row">
            <button class="tool-btn" id="sound-toggle">🔊 Sound On</button>
            <button class="tool-btn" id="voice-toggle">🗣️ Voice On</button>
            <button class="tool-btn" id="clear-btn">🗑️ Clear</button>
          </div>

        </div>
      </details>

    </div>

    <!-- Celebration Screen -->
    <div class="celebration-view" id="celebration-view">
      <div class="trophy-emoji">🏆</div>
      <h2 class="celebration-title" id="celebration-title">उत्कृष्ट! (Great Job!)</h2>
      <div class="celebration-score" id="celebration-score">१० / १०</div>
      <button class="restart-btn" id="restart-game-btn">
        <span>फेरि खेल्नुहोस् (Play Again) 🔁</span>
      </button>
    </div>

  </div>

  <script>
    // =========================================================================
    // 🇳🇵 COMPLETE NEPALI 0-100 DATA DICTIONARY
    // =========================================================================
    const NEP_DIGITS = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];

    function toNepaliDigits(n) {
      return String(n).split('').map(d => NEP_DIGITS[parseInt(d, 10)] !== undefined ? NEP_DIGITS[parseInt(d, 10)] : d).join('');
    }

    function formatEnglish(n) {
      return Number(n).toLocaleString('en-US');
    }

      { num: 73, nep: '७३', word: 'त्रिहत्तर', rom: 'Trihattari' },
      { num: 74, nep: '७४', word: 'चौहत्तर', rom: 'Chauhattari' },
      { num: 75, nep: '७५', word: 'पचहत्तर', rom: 'Pachhattari' },
      { num: 76, nep: '७६', word: 'छहत्तर', rom: 'Chhahattari' },
      { num: 77, nep: '७७', word: 'सतहत्तर', rom: 'Satahattari' },
      { num: 78, nep: '७८', word: 'अठहत्तर', rom: 'Athahattari' },
      { num: 79, nep: '७९', word: 'उननासी', rom: 'Unasi' },
      { num: 80, nep: '८०', word: 'असी', rom: 'Asi' },
      { num: 81, nep: '८१', word: 'एकासी', rom: 'Ekasi' },
      { num: 82, nep: '८२', word: 'बयासी', rom: 'Bayasi' },
      { num: 83, nep: '८३', word: 'त्रियासी', rom: 'Triyasi' },
      { num: 84, nep: '८४', word: 'चौरासी', rom: 'Chaurasi' },
      { num: 85, nep: '८५', word: 'पचासी', rom: 'Pachasi' },
      { num: 86, nep: '८६', word: 'छयासी', rom: 'Chhayasi' },
      { num: 87, nep: '८७', word: 'सत्तासी', rom: 'Sattasi' },
      { num: 88, nep: '८८', word: 'अट्ठासी', rom: 'Atthasi' },
      { num: 89, nep: '८९', word: 'उनन्नब्बे', rom: 'Unannabbey' },
      { num: 90, nep: '९०', word: 'नब्बे', rom: 'Nabbey' },
      { num: 91, nep: '९१', word: 'एकानब्बे', rom: 'Ekanabbey' },
      { num: 92, nep: '९२', word: 'बयानब्बे', rom: 'Bayanabbey' },
      { num: 93, nep: '९३', word: 'त्रियानब्बे', rom: 'Triyanabbey' },
      { num: 94, nep: '९४', word: 'चौरानब्बे', rom: 'Chauranabbey' },
      { num: 95, nep: '९५', word: 'पन्चानब्बे', rom: 'Panchanabbey' },
      { num: 96, nep: '९६', word: 'छयानब्बे', rom: 'Chhayanabbey' },
      { num: 97, nep: '९७', word: 'संतानब्बे', rom: 'Santanabbey' },
      { num: 98, nep: '९८', word: 'अन्ठानब्बे', rom: 'Anthanabbey' },
      { num: 99, nep: '९९', word: 'उनन्सय', rom: 'Unansaya' },
      { num: 100, nep: '१००', word: 'सय', rom: 'Saya' }
    ];

    // Converts either English digits or Nepali Devanagari digits to standard integer
    function parseInputDigits(str) {
      if (!str) return null;
      const nepToEng = { '०': '0', '१': '1', '२': '2', '३': '3', '४': '4', '५': '5', '६': '6', '७': '7', '८': '8', '९': '9' };
      const converted = str.trim().replace(/[०-९]/g, d => nepToEng[d]);
      const parsed = parseInt(converted, 10);
      return isNaN(parsed) ? null : parsed;
    }

    // =========================================================================
    // ⚙️ STATE & CONFIGURATION
    // =========================================================================
    let currentRange = '20';      // '20', '50', '100', 'tens'
    let showHint = true;
    const QUESTIONS_PER_ROUND = 10;
    const AUTO_ADVANCE_DELAY = 1100;

    let questionDeck = [];
    let currentIndex = 0;
    let score = 0;
    let isAnsweringLocked = false;
    let soundEnabled = true;
    let voiceEnabled = true;

    // Elements
    const gameStage = document.getElementById('game-stage');
    const celebrationView = document.getElementById('celebration-view');
    const scoreBadge = document.getElementById('score-badge');
    const progressFill = document.getElementById('progress-fill');
    const heroWord = document.getElementById('hero-word');
    const heroHint = document.getElementById('hero-hint');
    const digitInput = document.getElementById('digit-input');
    const btnCheck = document.getElementById('btn-check');
    const btnNext = document.getElementById('btn-next');
    const explanationCard = document.getElementById('explanation-card');
    const explanationMain = document.getElementById('explanation-main');
    const explanationSub = document.getElementById('explanation-sub');
    const listenBtn = document.getElementById('listen-btn');
    const hintToggle = document.getElementById('hint-toggle');
    const soundToggle = document.getElementById('sound-toggle');
    const voiceToggle = document.getElementById('voice-toggle');
    const clearBtn = document.getElementById('clear-btn');
    const restartGameBtn = document.getElementById('restart-game-btn');

    // Confetti canvas setup
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confetti = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // =========================================================================
    // 🔊 AUDIO & VOICE SYNTHESIS
    // =========================================================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCorrectChime() {
      if (!soundEnabled) return;
      initAudio();
      playTone(523.25, 0.1, 'triangle', 0.2); // C5
      setTimeout(() => playTone(659.25, 0.1, 'triangle', 0.2), 90); // E5
      setTimeout(() => playTone(783.99, 0.25, 'triangle', 0.25), 180); // G5
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      initAudio();
      playTone(320, 0.15, 'sawtooth', 0.12);
      setTimeout(() => playTone(240, 0.25, 'sawtooth', 0.12), 120);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playTone(freq, 0.2, 'triangle', 0.2), i * 110);
      });
    }

    function speakCurrentWord() {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      if (currentIndex >= questionDeck.length) return;
      try {
        window.speechSynthesis.cancel();
        const text = questionDeck[currentIndex].word;
        const utter = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const nepaliVoice = voices.find(v => v.lang.startsWith('ne')) ||
                            voices.find(v => v.lang.startsWith('hi')) ||
                            voices.find(v => v.lang.includes('IN'));
        if (nepaliVoice) utter.voice = nepaliVoice;
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    listenBtn.addEventListener('click', speakCurrentWord);

    // =========================================================================
    // 🎊 CONFETTI SYSTEM
    // =========================================================================
    function launchConfetti(count = 30) {
      const colors = ['#4f46e5', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: canvas.width / 2 + (Math.random() * 200 - 100),
          y: canvas.height * 0.45,
          r: Math.random() * 6 + 4,
          d: Math.random() * 25 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -10 - 4
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i];
        p.tiltAngle += p.tiltAngleIncremental;
        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.5;
        p.x += Math.sin(p.d);
        p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.vx *= 0.98;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
        ctx.stroke();

        if (p.y > canvas.height + 20) confetti.splice(i, 1);
      }
      requestAnimationFrame(updateConfetti);
    }
    requestAnimationFrame(updateConfetti);

    // =========================================================================
    // 🧠 QUESTION DECK GENERATION
    // =========================================================================
    function getRangePool() {
      if (currentRange === '20') {
        return NEP_DATA.slice(0, 21); // 0 to 20
      } else if (currentRange === '50') {
        return NEP_DATA.slice(0, 51); // 0 to 50
      } else if (currentRange === 'tens') {
        return NEP_DATA.filter(item => item.num % 10 === 0); // 0, 10, 20... 100
      } else {
        return NEP_DATA; // 0 to 100
      }
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function generateDeck() {
      const pool = getRangePool();
      const shuffled = shuffle(pool);
      return shuffled.slice(0, QUESTIONS_PER_ROUND);
    }

    // =========================================================================
    // 🎮 GAMEPLAY FLOW
    // =========================================================================
    function startRound() {
      questionDeck = generateDeck();
      currentIndex = 0;
      score = 0;
      isAnsweringLocked = false;

      gameStage.style.display = 'block';
      celebrationView.classList.remove('active');
      explanationCard.classList.remove('show');
      btnNext.classList.remove('show');
      btnCheck.disabled = false;

      updateScoreDisplay();
      renderQuestion();
    }

    function updateScoreDisplay() {
      scoreBadge.textContent = `⭐ ${toNepaliDigits(score)} / ${toNepaliDigits(questionDeck.length)}`;
      const pct = (currentIndex / questionDeck.length) * 100;
      progressFill.style.width = `${pct}%`;
    }

    function renderQuestion() {
      if (currentIndex >= questionDeck.length) {
        showCelebration();
        return;
      }

      isAnsweringLocked = false;
      btnCheck.disabled = false;
      explanationCard.classList.remove('show');
      btnNext.classList.remove('show');

      digitInput.value = '';
      digitInput.disabled = false;
      digitInput.className = 'digit-input-box';

      const q = questionDeck[currentIndex];
      heroWord.textContent = q.word;
      heroHint.textContent = showHint ? `(${q.rom})` : '';

      // Auto pronounce word on arrival
      setTimeout(() => {
        if (voiceEnabled) speakCurrentWord();
      }, 150);

      // Focus input for native Android numeric keyboard
      setTimeout(() => {
        digitInput.focus();
      }, 250);
    }

    function handleCheckAnswer() {
      if (isAnsweringLocked) return;
      initAudio();

      const rawVal = digitInput.value.trim();
      if (!rawVal) {
        digitInput.focus();
        return;
      }

      const enteredNum = parseInputDigits(rawVal);
      const q = questionDeck[currentIndex];
      const isCorrect = (enteredNum !== null && enteredNum === q.num);

      isAnsweringLocked = true;
      btnCheck.disabled = true;
      digitInput.disabled = true;

      if (isCorrect) {
        score++;
        playCorrectChime();
        launchConfetti(25);
        digitInput.classList.add('correct');
        speakCurrentWord();

        setTimeout(() => {
          currentIndex++;
          updateScoreDisplay();
          renderQuestion();
        }, AUTO_ADVANCE_DELAY);

      } else {
        playWrongSound();
        digitInput.classList.add('wrong');

        // Show answer in both Nepali numerals and English numerals
        explanationMain.innerHTML = `सही अंक: <strong>${q.nep} (${formatEnglish(q.num)})</strong>`;
        explanationSub.innerHTML = `अक्षरमा: <strong>${q.word} (${q.rom})</strong>`;
        explanationCard.classList.add('show');
        btnNext.classList.add('show');
      }
    }

    btnCheck.addEventListener('click', handleCheckAnswer);

    digitInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (btnNext.classList.contains('show')) {
          btnNext.click();
        } else {
          handleCheckAnswer();
        }
      }
    });

    btnNext.addEventListener('click', () => {
      initAudio();
      currentIndex++;
      updateScoreDisplay();
      renderQuestion();
    });

    function showCelebration() {
      progressFill.style.width = '100%';
      gameStage.style.display = 'none';
      celebrationView.classList.add('active');

      const total = questionDeck.length;
      document.getElementById('celebration-score').textContent = `${toNepaliDigits(score)} / ${toNepaliDigits(total)}`;

      const title = document.getElementById('celebration-title');
      if (score === total) {
        title.textContent = 'उत्कृष्ट! पूर्ण अंक! (Perfect 10/10!) 🌟';
        launchConfetti(65);
      } else if (score >= total * 0.7) {
        title.textContent = 'धेरै राम्रो! (Great Job!) 👏';
        launchConfetti(35);
      } else {
        title.textContent = 'राम्रो प्रयास! (Good Effort!) 🌱';
      }
      playWinSound();
    }

    // =========================================================================
    // ⚙️ CONTROLS & SETTINGS
    // =========================================================================
    document.querySelectorAll('[data-range]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        initAudio();
        document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentRange = e.currentTarget.dataset.range;
        startRound();
      });
    });

    hintToggle.addEventListener('click', () => {
      showHint = !showHint;
      hintToggle.textContent = showHint ? 'संकेत On (Pachchis)' : 'संकेत Off';
      hintToggle.classList.toggle('active', showHint);
      heroHint.textContent = (showHint && currentIndex < questionDeck.length)
        ? `(${questionDeck[currentIndex].rom})`
        : '';
    });

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
      if (soundEnabled) initAudio();
    });

    voiceToggle.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceToggle.textContent = voiceEnabled ? '🗣️ Voice On' : '🔇 Voice Off';
    });

    clearBtn.addEventListener('click', () => {
      digitInput.value = '';
      digitInput.focus();
    });

    restartGameBtn.addEventListener('click', () => {
      initAudio();
      startRound();
    });

    // Start on load
    window.addEventListener('DOMContentLoaded', startRound);
  </script>
