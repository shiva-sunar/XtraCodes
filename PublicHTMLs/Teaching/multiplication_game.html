<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Multiplication Adventure! 🚀</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #a5b4fc 0%, #fbcfe8 50%, #fef08a 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --correct: #22c55e;
      --correct-bg: #dcfce7;
      --wrong: #ef4444;
      --wrong-bg: #fee2e2;
      --text: #1e293b;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Main Container (Mobile focused phone size) */
    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    /* Header & Score Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .pill-badge {
      background: #eef2ff;
      border: 2px solid #c7d2fe;
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .table-tag {
      background: #fdf2f8;
      border-color: #fbcfe8;
      color: #be185d;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Question Display Card */
    .question-card {
      background: linear-gradient(135deg, #f8fafc, #edf2f7);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px dashed #cbd5e1;
      position: relative;
    }

    .avatar-icon {
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 6px;
      animation: float 2.5s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .question-text {
      font-size: 2.4rem;
      font-weight: 900;
      color: #1e1b4b;
      letter-spacing: 1px;
    }

    .question-blank {
      display: inline-block;
      min-width: 55px;
      border-bottom: 4px solid var(--primary);
      color: var(--primary);
      padding: 0 4px;
    }

    /* Feedback Banner */
    .feedback-banner {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
      transition: all 0.2s ease;
      opacity: 0;
      transform: scale(0.9);
    }

    .feedback-banner.show {
      opacity: 1;
      transform: scale(1);
    }

    .feedback-banner.correct {
      color: #15803d;
    }

    .feedback-banner.wrong {
      color: #b91c1c;
    }

    /* Options 2x2 Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid #e0e7ff;
      border-bottom-width: 6px;
      border-radius: 18px;
      font-size: 1.9rem;
      font-weight: 900;
      color: #312e81;
      padding: 18px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 3px;
      background: #f5f3ff;
    }

    /* Correct / Wrong states */
    .option-btn.correct-choice {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #166534 !important;
      animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .option-btn.wrong-choice {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #991b1b !important;
      animation: shake 0.4s ease;
    }

    .option-btn.reveal-correct {
      background: #f0fdf4 !important;
      border-color: var(--correct) !important;
      border-style: dashed;
      color: #15803d !important;
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Sound and Settings Toggle */
    .footer-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
    }

    .tool-btn {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .tool-btn:hover {
      background: #f1f5f9;
      color: #334155;
    }

    /* End Screen Celebration Modal */
    .end-screen {
      display: none;
      text-align: center;
      padding: 20px 8px;
    }

    .end-screen.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .trophy-icon {
      font-size: 4rem;
      margin-bottom: 12px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .celebrate-title {
      font-size: 2rem;
      font-weight: 900;
      color: #3730a3;
      margin-bottom: 8px;
    }

    .celebrate-subtitle {
      font-size: 1.1rem;
      color: #475569;
      margin-bottom: 20px;
    }

    .final-score-pill {
      display: inline-block;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      color: #b45309;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 24px;
    }

    .restart-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      color: #ffffff;
      border: none;
      border-bottom: 6px solid #3730a3;
      padding: 16px;
      border-radius: 18px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
      transition: all 0.15s ease;
    }

    .restart-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Floating Confetti Effect -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">

    <!-- Active Game Screen -->
    <div id="game-view">
      <div class="header">
        <div class="pill-badge table-tag" id="table-badge">
          <span>📘 Table of 5</span>
        </div>
        <div class="pill-badge" id="score-badge">
          <span>⭐ 0 / 10</span>
        </div>
      </div>

      <!-- Question Progress -->
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- Central Question -->
      <div class="question-card">
        <div class="avatar-icon" id="mood-avatar">🐱</div>
        <div class="question-text" id="question-text">
          <span id="multiplier-label">5</span> × <span id="current-x">1</span> = <span class="question-blank" id="answer-blank">?</span>
        </div>
      </div>

      <!-- Live Feedback Text -->
      <div class="feedback-banner" id="feedback-banner">
        Great Job! 🎉
      </div>

      <!-- 4 Answer Options -->
      <div class="options-grid" id="options-grid">
        <button class="option-btn" data-index="0">0</button>
        <button class="option-btn" data-index="1">0</button>
        <button class="option-btn" data-index="2">0</button>
        <button class="option-btn" data-index="3">0</button>
      </div>

      <!-- Simple Footer with Sound & Table Switcher -->
      <div class="footer-tools">
        <button class="tool-btn" id="sound-btn" title="Toggle Sound">
          🔊 Sound On
        </button>
        <button class="tool-btn" id="change-table-btn" title="Quick change table">
          🔄 Change Table
        </button>
      </div>
    </div>

    <!-- Celebration Screen (Shown at round completion) -->
    <div class="end-screen" id="end-screen">
      <div class="trophy-icon" id="final-trophy">🏆</div>
      <h2 class="celebrate-title" id="celebrate-title">Superstar!</h2>
      <p class="celebrate-subtitle" id="celebrate-subtitle">You finished the Table of 5 quiz!</p>
      
      <div>
        <div class="final-score-pill" id="final-score">10 / 10</div>
      </div>

      <button class="restart-btn" id="restart-btn">
        <span>Play Again</span> 🔁
      </button>
    </div>

  </div>

  <script>
    // =========================================================================
    // ⚙️ CONFIGURATION: CHANGE MULTIPLIER HERE
    // You can change MULTIPLIER to any number (e.g., 2, 3, 5, 7, 9, 12, etc.)!
    // =========================================================================
    let MULTIPLIER = 5;       // Multiplier table to practice
    const MIN_X = 1;          // Starting X (1)
    const MAX_X = 10;         // Ending X (10)
    const NEXT_DELAY_MS = 1300; // Delay before loading next question
    // =========================================================================

    // Game state
    let questionsList = [];
    let currentIndex = 0;
    let score = 0;
    let isAnsweringBlocked = false;
    let soundEnabled = true;

    // Pleasant kid-friendly avatars for different expressions
    const AVATARS = {
      default: ['🐱', '🐶', '🦊', '🐼', '🦄', '🐰'],
      happy: ['🥳', '🎉', '🌟', '🚀', '🌈', '🤩'],
      oops: ['🤔', '💡', '🧐', '🌱']
    };

    // Elements
    const gameView = document.getElementById('game-view');
    const endScreen = document.getElementById('end-screen');
    const tableBadge = document.getElementById('table-badge');
    const scoreBadge = document.getElementById('score-badge');
    const progressBar = document.getElementById('progress-bar');
    const multiplierLabel = document.getElementById('multiplier-label');
    const currentXElem = document.getElementById('current-x');
    const answerBlank = document.getElementById('answer-blank');
    const moodAvatar = document.getElementById('mood-avatar');
    const feedbackBanner = document.getElementById('feedback-banner');
    const optionButtons = document.querySelectorAll('.option-btn');
    const soundBtn = document.getElementById('sound-btn');
    const changeTableBtn = document.getElementById('change-table-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Confetti canvas setup
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // =========================================================================
    // 🔊 AUDIO SYNTHESIS (Zero external assets required, 100% standalone)
    // =========================================================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Audio error silent fallback
      }
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      initAudio();
      // Cheerful melodic chime: C5 -> E5 -> G5
      playTone(523.25, 0.15, 'triangle', 0.2);
      setTimeout(() => playTone(659.25, 0.15, 'triangle', 0.2), 100);
      setTimeout(() => playTone(783.99, 0.35, 'triangle', 0.25), 200);
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      initAudio();
      // Gentle boing down: F4 -> C#4
      playTone(349.23, 0.2, 'sawtooth', 0.12);
      setTimeout(() => playTone(277.18, 0.3, 'sawtooth', 0.12), 140);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 0.25, 'triangle', 0.25), idx * 120);
      });
    }

    // Gentle haptic feedback for mobile phones
    function triggerHaptic(type = 'success') {
      if ('vibrate' in navigator) {
        try {
          if (type === 'success') {
            navigator.vibrate([40, 30, 60]);
          } else {
            navigator.vibrate([100, 50, 100]);
          }
        } catch (e) {}
      }
    }

    // =========================================================================
    // 🎊 CONFETTI SYSTEM
    // =========================================================================
    function launchConfetti(count = 35) {
      const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() * 200 - 100),
          y: canvas.height * 0.4,
          r: Math.random() * 6 + 4,
          d: Math.random() * 25 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -10 - 4
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.tiltAngle += p.tiltAngleIncremental;
        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.5;
        p.x += Math.sin(p.d);
        p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;

        // Apply velocities
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // gravity
        p.vx *= 0.98;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
        ctx.stroke();

        // Remove offscreen
        if (p.y > canvas.height + 20) {
          confettiParticles.splice(i, 1);
        }
      }
      requestAnimationFrame(updateConfetti);
    }
    requestAnimationFrame(updateConfetti);

    // =========================================================================
    // 🧠 QUESTION & OPTION GENERATOR
    // =========================================================================
    // Generate questions from MIN_X to MAX_X and shuffle them
    function generateQuestionDeck() {
      const deck = [];
      for (let x = MIN_X; x <= MAX_X; x++) {
        deck.push(x);
      }
      // Shuffle using Fisher-Yates
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // Generate 4 plausible options including the correct answer
    function generateOptions(correctVal, currentX) {
      const options = new Set([correctVal]);

      // Smart distractor strategies that match common child mistakes:
      // 1. Neighbor multiples: MULTIPLIER * (X ± 1) or MULTIPLIER * (X ± 2)
      // 2. Off by +/- MULTIPLIER or +/- (MULTIPLIER / 2) or +/- 1..3
      // 3. Addition confusion: MULTIPLIER + X
      const candidates = [
        MULTIPLIER * (currentX + 1),
        MULTIPLIER * (currentX - 1),
        MULTIPLIER * (currentX + 2),
        MULTIPLIER * (currentX - 2),
        correctVal + MULTIPLIER,
        correctVal - MULTIPLIER,
        correctVal + 5,
        correctVal - 5,
        correctVal + 10,
        correctVal + 2,
        correctVal - 2,
        MULTIPLIER + currentX
      ];

      // Shuffle candidate distractors
      candidates.sort(() => Math.random() - 0.5);

      for (const val of candidates) {
        if (options.size >= 4) break;
        if (val > 0 && val !== correctVal) {
          options.add(val);
        }
      }

      // Fallback if needed to guarantee 4 unique positive choices
      let fallbackOffset = 1;
      while (options.size < 4) {
        const alt = correctVal + (fallbackOffset * (Math.random() > 0.5 ? 1 : -1));
        if (alt > 0 && !options.has(alt)) {
          options.add(alt);
        }
        fallbackOffset++;
      }

      // Convert to array and shuffle options
      const optionsArray = Array.from(options);
      return optionsArray.sort(() => Math.random() - 0.5);
    }

    // =========================================================================
    // 🎮 GAME FLOW
    // =========================================================================
    function startGame() {
      questionsList = generateQuestionDeck();
      currentIndex = 0;
      score = 0;
      isAnsweringBlocked = false;

      // Update static header labels
      tableBadge.innerHTML = `<span>📘 Table of ${MULTIPLIER}</span>`;
      multiplierLabel.textContent = MULTIPLIER;

      gameView.style.display = 'block';
      endScreen.classList.remove('active');

      updateScoreDisplay();
      renderQuestion();
    }

    function updateScoreDisplay() {
      scoreBadge.innerHTML = `<span>⭐ ${score} / ${questionsList.length}</span>`;
      const progressPercent = (currentIndex / questionsList.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }

    function renderQuestion() {
      if (currentIndex >= questionsList.length) {
        showEndCelebration();
        return;
      }

      isAnsweringBlocked = false;
      const currentX = questionsList[currentIndex];
      const correctVal = MULTIPLIER * currentX;

      // UI updates
      currentXElem.textContent = currentX;
      answerBlank.textContent = '?';
      multiplierLabel.textContent = MULTIPLIER;

      // Random friendly avatar
      moodAvatar.textContent = AVATARS.default[Math.floor(Math.random() * AVATARS.default.length)];

      // Reset feedback banner
      feedbackBanner.className = 'feedback-banner';
      feedbackBanner.textContent = '';

      // Generate 4 options
      const options = generateOptions(correctVal, currentX);

      // Bind to buttons
      optionButtons.forEach((btn, idx) => {
        btn.textContent = options[idx];
        btn.dataset.value = options[idx];
        btn.dataset.correct = (options[idx] === correctVal);
        btn.className = 'option-btn';
        btn.disabled = false;
      });
    }

    function handleOptionSelect(e) {
      if (isAnsweringBlocked) return;
      initAudio();

      const btn = e.currentTarget;
      const isCorrect = btn.dataset.correct === 'true';
      const currentX = questionsList[currentIndex];
      const correctVal = MULTIPLIER * currentX;

      isAnsweringBlocked = true;

      // Fill in question blank
      answerBlank.textContent = btn.dataset.value;

      if (isCorrect) {
        // Success path
        score++;
        btn.classList.add('correct-choice');
        feedbackBanner.textContent = '🌟 Super! That is correct!';
        feedbackBanner.className = 'feedback-banner show correct';
        moodAvatar.textContent = AVATARS.happy[Math.floor(Math.random() * AVATARS.happy.length)];

        playCorrectSound();
        triggerHaptic('success');
        launchConfetti(25);
      } else {
        // Wrong path
        btn.classList.add('wrong-choice');
        feedbackBanner.textContent = `Oops! ${MULTIPLIER} × ${currentX} = ${correctVal} 💡`;
        feedbackBanner.className = 'feedback-banner show wrong';
        moodAvatar.textContent = AVATARS.oops[Math.floor(Math.random() * AVATARS.oops.length)];

        // Highlight correct button so sister learns immediately
        optionButtons.forEach(b => {
          if (b.dataset.correct === 'true') {
            b.classList.add('reveal-correct');
          }
        });

        playWrongSound();
        triggerHaptic('wrong');
      }

      // Advance to next after short delay
      setTimeout(() => {
        currentIndex++;
        updateScoreDisplay();
        renderQuestion();
      }, NEXT_DELAY_MS);
    }

    function showEndCelebration() {
      progressBar.style.width = '100%';
      gameView.style.display = 'none';
      endScreen.classList.add('active');

      const total = questionsList.length;
      document.getElementById('final-score').textContent = `${score} / ${total}`;

      const title = document.getElementById('celebrate-title');
      const subtitle = document.getElementById('celebrate-subtitle');
      const trophy = document.getElementById('final-trophy');

      if (score === total) {
        trophy.textContent = '🏆';
        title.textContent = 'Perfect Score!';
        subtitle.textContent = `You're a master at the Table of ${MULTIPLIER}! 🎉`;
        launchConfetti(70);
      } else if (score >= total * 0.7) {
        trophy.textContent = '🌟';
        title.textContent = 'Awesome Job!';
        subtitle.textContent = `So close to perfection! Great practicing!`;
        launchConfetti(45);
      } else {
        trophy.textContent = '🌱';
        title.textContent = 'Great Effort!';
        subtitle.textContent = `Keep practicing and you will get 10/10 next time!`;
      }

      playWinSound();
    }

    // =========================================================================
    // ⚙️ EVENT LISTENERS & IN-GAME MULTIPLIER SWITCHER
    // =========================================================================
    optionButtons.forEach(btn => {
      btn.addEventListener('click', handleOptionSelect);
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      startGame();
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
      if (soundEnabled) initAudio();
    });

    changeTableBtn.addEventListener('click', () => {
      initAudio();
      const input = prompt(
        `Current table is ${MULTIPLIER}.\nEnter a new table multiplier (e.g. 2, 3, 5, 7, 10):`,
        MULTIPLIER
      );
      if (input !== null) {
        const parsed = parseInt(input.trim(), 10);
        if (!isNaN(parsed) && parsed > 0 && parsed <= 99) {
          MULTIPLIER = parsed;
          startGame();
        } else {
          alert('Please enter a valid positive number (1 - 99)!');
        }
      }
    });

    // Initialize first game on load
    window.addEventListener('DOMContentLoaded', startGame);
  </script>
</body>
</html>
