<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>What Time Is It? ⏰ Clock Adventure</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #6d28d9;
      --bg-gradient: linear-gradient(135deg, #c7d2fe 0%, #fed7aa 50%, #fbcfe8 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
      --text: #1e293b;
      --radius: 26px;
      --hour-color: #4338ca;
      --minute-color: #db2777;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Main Container (Mobile focused size) */
    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 45px rgba(109, 40, 217, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    /* Header & Score Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pill-badge {
      background: #f5f3ff;
      border: 2px solid #ddd6fe;
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .level-tag {
      background: #fdf2f8;
      border-color: #fbcfe8;
      color: #be185d;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Clock Stage Card */
    .clock-stage {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 22px;
      padding: 14px 10px 10px;
      text-align: center;
      margin-bottom: 12px;
      border: 2px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Interactive SVG Clock Face */
    .clock-svg-wrap {
      width: 250px;
      height: 250px;
      max-width: 72vw;
      max-height: 72vw;
      position: relative;
      margin: 0 auto;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08));
    }

    svg.clock-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Legend reminder helper */
    .clock-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot-hour {
      width: 12px;
      height: 12px;
      background: var(--hour-color);
      border-radius: 4px;
    }

    .dot-minute {
      width: 12px;
      height: 12px;
      background: var(--minute-color);
      border-radius: 4px;
    }

    /* Feedback Banner */
    .feedback-banner {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 12px;
      text-align: center;
      transition: all 0.25s ease;
      opacity: 0;
      transform: scale(0.92);
      padding: 2px 6px;
      border-radius: 12px;
    }

    .feedback-banner.show {
      opacity: 1;
      transform: scale(1);
    }

    .feedback-banner.correct {
      color: #15803d;
      background: var(--correct-bg);
    }

    .feedback-banner.wrong {
      color: #991b1b;
      background: var(--wrong-bg);
    }

    .feedback-subtip {
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 2px;
      color: #475569;
    }

    /* Options 2x2 Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid #ddd6fe;
      border-bottom-width: 6px;
      border-radius: 18px;
      font-size: 1.85rem;
      font-weight: 900;
      color: #312e81;
      padding: 16px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      letter-spacing: 0.5px;
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 3px;
      background: #f5f3ff;
    }

    /* Correct / Wrong states */
    .option-btn.correct-choice {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #166534 !important;
      animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .option-btn.wrong-choice {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #991b1b !important;
      animation: shake 0.4s ease;
    }

    .option-btn.reveal-correct {
      background: #f0fdf4 !important;
      border-color: var(--correct) !important;
      border-style: dashed;
      color: #15803d !important;
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Footer Toolbar */
    .footer-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
    }

    .tool-btn {
      background: transparent;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .tool-btn:hover {
      background: #f1f5f9;
      color: #334155;
    }

    /* End Screen Celebration */
    .end-screen {
      display: none;
      text-align: center;
      padding: 24px 8px;
    }

    .end-screen.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .trophy-icon {
      font-size: 4.5rem;
      margin-bottom: 12px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .celebrate-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #4c1d95;
      margin-bottom: 8px;
    }

    .celebrate-subtitle {
      font-size: 1.1rem;
      color: #475569;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .final-score-pill {
      display: inline-block;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      color: #b45309;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 24px;
    }

    .restart-btn {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: #ffffff;
      border: none;
      border-bottom: 6px solid #5b21b6;
      padding: 16px;
      border-radius: 18px;
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
      transition: all 0.15s ease;
    }

    .restart-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">

    <!-- Active Game View -->
    <div id="game-view">
      <div class="header">
        <div class="pill-badge level-tag" id="level-badge">
          <span>⏰ 12-Hour Clock</span>
        </div>
        <div class="pill-badge" id="score-badge">
          <span>⭐ 0 / 10</span>
        </div>
      </div>

      <!-- Question Progress -->
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- Clock Display -->
      <div class="clock-stage">
        <div class="clock-svg-wrap">
          <svg class="clock-svg" viewBox="0 0 300 300" id="clock-svg">
            <!-- Clock Face Background -->
            <circle cx="150" cy="150" r="142" fill="#ffffff" stroke="#c4b5fd" stroke-width="8"/>
            <circle cx="150" cy="150" r="134" fill="#fafafa"/>

            <!-- Clock Ticks Group (generated by JS) -->
            <g id="clock-ticks"></g>

            <!-- Numbers 1 to 12 (generated by JS) -->
            <g id="clock-numbers"></g>

            <!-- Hands -->
            <!-- Hour Hand (Shorter, thicker, indigo) -->
            <line id="hour-hand" x1="150" y1="150" x2="150" y2="85"
                  stroke="var(--hour-color)" stroke-width="8.5" stroke-linecap="round"/>

            <!-- Minute Hand (Longer, pink/magenta) -->
            <line id="minute-hand" x1="150" y1="150" x2="150" y2="52"
                  stroke="var(--minute-color)" stroke-width="5.5" stroke-linecap="round"/>

            <!-- Center Pin -->
            <circle cx="150" cy="150" r="8" fill="#312e81"/>
            <circle cx="150" cy="150" r="3.5" fill="#ffffff"/>
          </svg>
        </div>

        <!-- Visual legend to remind sister of hand roles -->
        <div class="clock-legend">
          <div class="legend-item">
            <span class="dot-hour"></span>
            <span>Short = Hour</span>
          </div>
          <div class="legend-item">
            <span class="dot-minute"></span>
            <span>Long = Minutes</span>
          </div>
        </div>
      </div>

      <!-- Live Feedback Banner -->
      <div class="feedback-banner" id="feedback-banner">
        <div id="feedback-main">Choose the matching time! 👇</div>
        <div class="feedback-subtip" id="feedback-subtip"></div>
      </div>

      <!-- 4 Answer Options (Hours kept the same, focuses on minute reading) -->
      <div class="options-grid" id="options-grid">
        <button class="option-btn" data-index="0">--:--</button>
        <button class="option-btn" data-index="1">--:--</button>
        <button class="option-btn" data-index="2">--:--</button>
        <button class="option-btn" data-index="3">--:--</button>
      </div>

      <!-- Footer Toolbar -->
      <div class="footer-tools">
        <button class="tool-btn" id="sound-btn" title="Toggle Sound">
          🔊 Sound On
        </button>
        <button class="tool-btn" id="minute-mode-btn" title="Change minute difficulty">
          🎯 Minutes: by 5s
        </button>
      </div>
    </div>

    <!-- Celebration Screen -->
    <div class="end-screen" id="end-screen">
      <div class="trophy-icon" id="final-trophy">🏆</div>
      <h2 class="celebrate-title" id="celebrate-title">Time Wizard!</h2>
      <p class="celebrate-subtitle" id="celebrate-subtitle">You're getting so good at reading the minute hand!</p>
      
      <div>
        <div class="final-score-pill" id="final-score">10 / 10</div>
      </div>

      <button class="restart-btn" id="restart-btn">
        <span>Play Again</span> 🔁
      </button>
    </div>

  </div>

  <script>
    // =========================================================================
    // ⚙️ CONFIGURATION: CUSTOMIZE CLOCK GAME HERE
    // =========================================================================
    // MINUTE_INTERVAL:
    //  5  = Minutes are multiples of 5 (:00, :05, :10 ... :55) -> BEST for learning with the 5x table!
    //  15 = Only quarters (:00, :15, :30, :45)
    //  1  = Any exact minute (advanced)
    let MINUTE_INTERVAL = 5;

    const TOTAL_QUESTIONS_PER_ROUND = 10;
    const NEXT_DELAY_MS = 1500;
    // =========================================================================

    // Game state
    let questionsDeck = [];
    let currentIndex = 0;
    let score = 0;
    let isAnsweringBlocked = false;
    let soundEnabled = true;

    // Elements
    const gameView = document.getElementById('game-view');
    const endScreen = document.getElementById('end-screen');
    const scoreBadge = document.getElementById('score-badge');
    const progressBar = document.getElementById('progress-bar');
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const feedbackBanner = document.getElementById('feedback-banner');
    const feedbackMain = document.getElementById('feedback-main');
    const feedbackSubtip = document.getElementById('feedback-subtip');
    const optionButtons = document.querySelectorAll('.option-btn');
    const soundBtn = document.getElementById('sound-btn');
    const minuteModeBtn = document.getElementById('minute-mode-btn');
    const restartBtn = document.getElementById('restart-btn');
    const clockTicksG = document.getElementById('clock-ticks');
    const clockNumbersG = document.getElementById('clock-numbers');

    // Confetti Canvas
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // =========================================================================
    // 🎨 DRAW CLOCK DIAL & TICKS (Sharp vector numbers & 60 minute ticks)
    // =========================================================================
    function buildClockFace() {
      clockTicksG.innerHTML = '';
      clockNumbersG.innerHTML = '';

      const cx = 150;
      const cy = 150;

      // 60 Minute ticks
      for (let m = 0; m < 60; m++) {
        const angle = (m * 6) * (Math.PI / 180);
        const isFive = (m % 5 === 0);
        const rOuter = 132;
        const rInner = isFive ? 118 : 124;

        const x1 = cx + rOuter * Math.sin(angle);
        const y1 = cy - rOuter * Math.cos(angle);
        const x2 = cx + rInner * Math.sin(angle);
        const y2 = cy - rInner * Math.cos(angle);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', isFive ? '#6366f1' : '#cbd5e1');
        line.setAttribute('stroke-width', isFive ? '3.5' : '1.5');
        line.setAttribute('stroke-linecap', 'round');
        clockTicksG.appendChild(line);
      }

      // 12 Numbers (1 to 12)
      for (let h = 1; h <= 12; h++) {
        const angle = (h * 30) * (Math.PI / 180);
        const rNum = 101;
        const x = cx + rNum * Math.sin(angle);
        const y = cy - rNum * Math.cos(angle) + 7; // vertical center offset

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '21');
        text.setAttribute('font-weight', '900');
        text.setAttribute('fill', '#1e1b4b');
        text.setAttribute('font-family', 'system-ui, sans-serif');
        text.textContent = h;
        clockNumbersG.appendChild(text);
      }
    }

    // Update hands rotation
    function setClockTime(hours, minutes) {
      // 360 degrees / 60 minutes = 6 deg per minute
      const minuteDeg = minutes * 6;
      // 360 degrees / 12 hours = 30 deg per hour + smooth 0.5 deg per minute
      const hourDeg = ((hours % 12) * 30) + (minutes * 0.5);

      hourHand.setAttribute('transform', `rotate(${hourDeg} 150 150)`);
      minuteHand.setAttribute('transform', `rotate(${minuteDeg} 150 150)`);
    }

    // =========================================================================
    // 🔊 AUDIO SYNTHESIS
    // =========================================================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      initAudio();
      // Cheerful chime: E5 -> G#5 -> B5
      playTone(659.25, 0.12, 'triangle', 0.2);
      setTimeout(() => playTone(830.61, 0.12, 'triangle', 0.2), 90);
      setTimeout(() => playTone(987.77, 0.3, 'triangle', 0.25), 180);
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      initAudio();
      playTone(329.63, 0.18, 'sawtooth', 0.12);
      setTimeout(() => playTone(261.63, 0.25, 'sawtooth', 0.12), 120);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 0.25, 'triangle', 0.25), idx * 110);
      });
    }

    function triggerHaptic(type = 'success') {
      if ('vibrate' in navigator) {
        try {
          navigator.vibrate(type === 'success' ? [40, 30, 60] : [100, 50, 100]);
        } catch (e) {}
      }
    }

    // =========================================================================
    // 🎊 CONFETTI SYSTEM
    // =========================================================================
    function launchConfetti(count = 30) {
      const colors = ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#06b6d4'];
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() * 220 - 110),
          y: canvas.height * 0.45,
          r: Math.random() * 6 + 4,
          d: Math.random() * 25 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -10 - 4
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.tiltAngle += p.tiltAngleIncremental;
        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.5;
        p.x += Math.sin(p.d);
        p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.vx *= 0.98;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
        ctx.stroke();

        if (p.y > canvas.height + 20) {
          confettiParticles.splice(i, 1);
        }
      }
      requestAnimationFrame(updateConfetti);
    }
    requestAnimationFrame(updateConfetti);

    // =========================================================================
    // 🧠 QUESTION & OPTION GENERATOR
    // Key Pedagogical Rule: 
    // - Focuses heavily on the minute hand.
    // - TRICKY CHALLENGE: When minutes are approaching the next hour (e.g. 7:55),
    //   we intentionally include the premature next-hour option (8:55) to test
    //   if she knows the hour hand hasn't reached the next hour yet!
    // =========================================================================
    function formatTime(h, m) {
      const mm = m < 10 ? `0${m}` : `${m}`;
      return `${h}:${mm}`;
    }

    function generateDeck() {
      const possibleMinutes = [];
      for (let m = 0; m < 60; m += MINUTE_INTERVAL) {
        possibleMinutes.push(m);
      }

      const deck = [];
      for (let i = 0; i < TOTAL_QUESTIONS_PER_ROUND; i++) {
        const h = Math.floor(Math.random() * 12) + 1; // 1 to 12
        let m;
        // Ensure at least 3-4 questions per round feature the "almost next hour" (:45, :50, :55)
        if (i < 4 && MINUTE_INTERVAL <= 5) {
          const lateMinutes = [45, 50, 55];
          m = lateMinutes[Math.floor(Math.random() * lateMinutes.length)];
        } else {
          m = possibleMinutes[Math.floor(Math.random() * possibleMinutes.length)];
        }
        deck.push({ hours: h, minutes: m });
      }
      // Shuffle the deck so questions are distributed randomly
      return deck.sort(() => Math.random() - 0.5);
    }

    function generateOptions(targetH, targetM) {
      const correctStr = formatTime(targetH, targetM);
      const options = new Set([correctStr]);

      // 🚨 TRICKY TRAP: When it's about to be the next hour (e.g. 7:45, 7:50, 7:55),
      // add the premature next-hour trap option (e.g., 8:55 for 7:55)!
      if (targetM >= 40) {
        const nextH = (targetH % 12) + 1;
        options.add(formatTime(nextH, targetM));
      }

      // Distractor candidates (using the same hour targetH):
      const minuteCandidates = [];

      // Step offsets
      minuteCandidates.push((targetM + 5) % 60);
      minuteCandidates.push((targetM - 5 + 60) % 60);
      minuteCandidates.push((targetM + 10) % 60);
      minuteCandidates.push((targetM - 10 + 60) % 60);
      minuteCandidates.push((targetM + 15) % 60);
      minuteCandidates.push((targetM - 15 + 60) % 60);
      minuteCandidates.push((targetM + 30) % 60);

      // Classic kid pitfall: reading clock dial number directly (e.g. at :20 hand points to 4 -> :04)
      if (targetM > 0 && targetM % 5 === 0) {
        const dialNumber = targetM / 5;
        if (dialNumber !== targetM) {
          minuteCandidates.push(dialNumber);
        }
      }

      // Shuffle candidates
      minuteCandidates.sort(() => Math.random() - 0.5);

      for (const mVal of minuteCandidates) {
        if (options.size >= 4) break;
        const optStr = formatTime(targetH, mVal);
        options.add(optStr);
      }

      // Fallback: fill any missing with random minutes on the same hour
      let fallbackM = 0;
      while (options.size < 4) {
        const optStr = formatTime(targetH, fallbackM);
        options.add(optStr);
        fallbackM = (fallbackM + 5) % 60;
      }

      // Return shuffled array of 4 choices
      return Array.from(options).sort(() => Math.random() - 0.5);
    }

    // =========================================================================
    // 🎮 GAME FLOW
    // =========================================================================
    function startGame() {
      questionsDeck = generateDeck();
      currentIndex = 0;
      score = 0;
      isAnsweringBlocked = false;

      gameView.style.display = 'block';
      endScreen.classList.remove('active');

      updateScoreDisplay();
      renderQuestion();
    }

    function updateScoreDisplay() {
      scoreBadge.innerHTML = `<span>⭐ ${score} / ${questionsDeck.length}</span>`;
      const progressPercent = (currentIndex / questionsDeck.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }

    function renderQuestion() {
      if (currentIndex >= questionsDeck.length) {
        showEndCelebration();
        return;
      }

      isAnsweringBlocked = false;
      const q = questionsDeck[currentIndex];

      // Update analogue clock hands
      setClockTime(q.hours, q.minutes);

      // Reset feedback
      feedbackBanner.className = 'feedback-banner';
      feedbackMain.textContent = 'Look at the long hand! What time is it?';
      feedbackSubtip.textContent = '';

      // Generate 4 options (same hour, different minutes)
      const correctStr = formatTime(q.hours, q.minutes);
      const options = generateOptions(q.hours, q.minutes);

      optionButtons.forEach((btn, idx) => {
        btn.textContent = options[idx];
        btn.dataset.value = options[idx];
        btn.dataset.correct = (options[idx] === correctStr);
        btn.className = 'option-btn';
        btn.disabled = false;
      });
    }

    function handleOptionSelect(e) {
      if (isAnsweringBlocked) return;
      initAudio();

      const btn = e.currentTarget;
      const isCorrect = btn.dataset.correct === 'true';
      const q = questionsDeck[currentIndex];
      const correctStr = formatTime(q.hours, q.minutes);

      isAnsweringBlocked = true;

      if (isCorrect) {
        score++;
        btn.classList.add('correct-choice');
        feedbackMain.textContent = `🌟 Correct! It is ${correctStr}!`;

        // Educational reinforcement connecting with the 5 multiplication table!
        if (q.minutes > 0 && q.minutes % 5 === 0) {
          const dialNum = q.minutes / 5;
          feedbackSubtip.textContent = `Tip: Long hand points to ${dialNum} ➔ ${dialNum} × 5 = ${q.minutes} min!`;
        } else if (q.minutes === 0) {
          feedbackSubtip.textContent = `Tip: Long hand at the top (12) means :00 o'clock!`;
        }

        feedbackBanner.className = 'feedback-banner show correct';
        playCorrectSound();
        triggerHaptic('success');
        launchConfetti(25);
      } else {
        btn.classList.add('wrong-choice');
        feedbackMain.textContent = `Oops! The time is ${correctStr}! ⏰`;

        const chosenVal = btn.dataset.value;
        const nextH = (q.hours % 12) + 1;
        const trapStr = formatTime(nextH, q.minutes);

        // Specific educational explanation if she fell for the "almost next hour" trap!
        if (chosenVal === trapStr && q.minutes >= 40) {
          feedbackSubtip.textContent = `Tricky! Short hand is near ${nextH}, but it's still ${q.hours} until the long hand reaches 12!`;
        } else if (q.minutes > 0 && q.minutes % 5 === 0) {
          const dialNum = q.minutes / 5;
          feedbackSubtip.textContent = `Long hand points to ${dialNum}: count by 5s (${dialNum} × 5 = ${q.minutes})!`;
        } else if (q.minutes === 0) {
          feedbackSubtip.textContent = `When the long hand points to 12, it is :00 o'clock!`;
        } else {
          feedbackSubtip.textContent = `Watch where the pink long hand reaches!`;
        }

        feedbackBanner.className = 'feedback-banner show wrong';

        // Highlight the correct answer button
        optionButtons.forEach(b => {
          if (b.dataset.correct === 'true') {
            b.classList.add('reveal-correct');
          }
        });

        playWrongSound();
        triggerHaptic('wrong');
      }

      // Allow slightly longer delay on wrong answer so she can read the educational tip
      const delay = isCorrect ? 1300 : 2200;
      setTimeout(() => {
        currentIndex++;
        updateScoreDisplay();
        renderQuestion();
      }, delay);
    }

    function showEndCelebration() {
      progressBar.style.width = '100%';
      gameView.style.display = 'none';
      endScreen.classList.add('active');

      const total = questionsDeck.length;
      document.getElementById('final-score').textContent = `${score} / ${total}`;

      const title = document.getElementById('celebrate-title');
      const subtitle = document.getElementById('celebrate-subtitle');
      const trophy = document.getElementById('final-trophy');

      if (score === total) {
        trophy.textContent = '🏆';
        title.textContent = 'Time Master!';
        subtitle.textContent = `10 out of 10! You read every minute hand perfectly! 🌟`;
        launchConfetti(70);
      } else if (score >= total * 0.7) {
        trophy.textContent = '⭐';
        title.textContent = 'Great Job!';
        subtitle.textContent = `You are getting so fast at reading minutes!`;
        launchConfetti(45);
      } else {
        trophy.textContent = '🌱';
        title.textContent = 'Good Practice!';
        subtitle.textContent = `Remember: multiply the number the long hand points to by 5!`;
      }

      playWinSound();
    }

    // =========================================================================
    // ⚙️ EVENT LISTENERS & DIFFICULTY TOGGLE
    // =========================================================================
    optionButtons.forEach(btn => {
      btn.addEventListener('click', handleOptionSelect);
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      startGame();
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
      if (soundEnabled) initAudio();
    });

    minuteModeBtn.addEventListener('click', () => {
      initAudio();
      if (MINUTE_INTERVAL === 5) {
        MINUTE_INTERVAL = 15;
        minuteModeBtn.textContent = '🎯 Minutes: by 15s';
      } else if (MINUTE_INTERVAL === 15) {
        MINUTE_INTERVAL = 5;
        minuteModeBtn.textContent = '🎯 Minutes: by 5s';
      }
      startGame();
    });

    // Initialize clock vectors and start game
    window.addEventListener('DOMContentLoaded', () => {
      buildClockFace();
      startGame();
    });
  </script>
</body>
