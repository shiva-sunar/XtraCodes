<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Math Quest! ➕ ➖ Addition & Subtraction</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --bg-gradient: linear-gradient(135deg, #ddd6fe 0%, #fed7aa 50%, #fbcfe8 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
      --text: #1e293b;
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: var(--text);
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 45px rgba(79, 70, 229, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #fff;
      position: relative;
    }

    /* Header Bar */
    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge {
      background: #eef2ff;
      border: 2px solid #c7d2fe;
      color: var(--primary-dark);
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Progress Bar */
    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #ec4899);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Column Math Stage */
    .column-stage {
      width: 100%;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 22px;
      padding: 16px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px dashed #cbd5e1;
      margin-bottom: 12px;
    }

    .math-column-table {
      display: inline-grid;
      gap: 6px 8px;
      align-items: center;
      justify-items: center;
      background: #ffffff;
      border: 3px solid #e0e7ff;
      border-radius: 20px;
      padding: 12px 18px 14px;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.08);
      margin: 0 auto;
    }

    .col-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 52px;
    }

    .col-digit {
      font-size: 2.5rem;
      font-weight: 900;
      color: #1e1b4b;
      line-height: 1;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .col-op {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ec4899;
      line-height: 1;
    }

    .col-divider {
      grid-column: 1 / -1;
      height: 3.5px;
      background: #312e81;
      border-radius: 999px;
      width: 100%;
      margin: 2px 0 6px;
    }

    .digit-box {
      width: 48px;
      height: 54px;
      font-size: 1.9rem;
      font-weight: 900;
      color: #312e81;
      text-align: center;
      background: #ffffff;
      border: 3px solid #6366f1;
      border-radius: 14px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      transition: all 0.15s ease;
      caret-color: #6366f1;
      padding: 0;
      outline: none;
    }

    .digit-box:focus {
      border-color: #ec4899;
      background: #fdf2f8;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }

    .digit-box.carry-box {
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
      font-weight: 800;
      border: 2.5px dashed #f472b6;
      border-radius: 10px;
      background: #fff5f8;
      color: #be185d;
      margin: 0 auto;
    }

    .digit-box.carry-box:focus {
      border-color: #db2777;
      border-style: solid;
      background: #fce7f3;
    }

    .digit-box.correct {
      border-color: #16a34a !important;
      background: #dcfce7 !important;
      color: #15803d !important;
    }

    .digit-box.wrong {
      border-color: #dc2626 !important;
      background: #fee2e2 !important;
      color: #991b1b !important;
      animation: shake 0.4s ease;
    }

    /* Check Answer Button (using Native Android Numeric Keypad) */
    .check-answer-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #047857;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
      transition: all 0.12s ease;
      margin-bottom: 8px;
    }

    .check-answer-btn:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    .check-answer-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Explanation & Feedback Box */
    .explanation-card {
      width: 100%;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: none;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .explanation-card.show {
      display: block !important;
    }

    .explanation-card.correct {
      background: var(--correct-bg);
      border: 3px solid var(--correct);
      color: #166534;
      text-align: center;
    }

    .explanation-card.wrong {
      background: #fff5f5;
      border: 3px solid #ef4444;
      color: #991b1b;
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.15);
    }

    /* Correction Highlight Box */
    .correction-banner {
      background: #ffffff;
      border: 2.5px dashed #f87171;
      border-radius: 14px;
      padding: 12px 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .correction-pill-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .badge-wrong-ans {
      background: #fee2e2;
      color: #b91c1c;
      padding: 4px 12px;
      border-radius: 999px;
      text-decoration: line-through;
      font-size: 0.95rem;
    }

    .badge-correct-ans {
      background: #dcfce7;
      color: #15803d;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 1.15rem;
      border: 2px solid #86efac;
    }

    .correction-big-equation {
      font-size: 1.6rem;
      font-weight: 900;
      color: #15803d;
      letter-spacing: 1px;
    }

    .explanation-title {
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .explanation-steps {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.5;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 12px;
      color: #334155;
    }

    /* Column Math Pattern Display */
    .column-math-pre {
      display: inline-block;
      text-align: right;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.25;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px 24px;
      margin: 4px auto;
      color: #1e1b4b;
      letter-spacing: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .calc-steps-box {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.6;
      color: #1e293b;
      text-align: left;
    }

    /* Next Question Button (shown on wrong answer until pressed) */
    .next-btn-wrap {
      display: none;
      width: 100%;
      margin-bottom: 12px;
    }

    .next-btn-wrap.show {
      display: block;
      animation: popIn 0.3s ease;
    }

    .next-action-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #3730a3;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
      transition: all 0.1s ease;
    }

    .next-action-btn:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    /* Collapsible Settings Accordion (Collapsed by default) */
    .settings-collapse {
      width: 100%;
      margin-top: 14px;
      border-radius: 18px;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .settings-summary {
      padding: 11px 16px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #4f46e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style: none;
      user-select: none;
      background: #f8fafc;
    }

    .settings-summary::-webkit-details-marker {
      display: none;
    }

    .settings-collapse[open] {
      border-style: solid;
      border-color: #c7d2fe;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.08);
    }

    .settings-collapse[open] .chevron-icon {
      transform: rotate(180deg);
    }

    .chevron-icon {
      transition: transform 0.2s ease;
      font-size: 1.15rem;
      color: #64748b;
    }

    /* Bottom Parameter Settings Card (inside details) */
    .bottom-settings-card {
      width: 100%;
      padding: 6px 14px 12px;
    }

    .settings-row-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 5px;
    }

    .mode-pills, .digits-pills {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 8px;
    }

    .mode-tab, .digit-tab {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.82rem;
      font-weight: 800;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #64748b;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .mode-tab.active, .digit-tab.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #3730a3;
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.25);
    }

    /* Footer Toolbar */
    .footer-tools {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
    }

    .tool-btn {
      background: transparent;
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .tool-btn:hover {
      background: #f1f5f9;
      color: #1e293b;
    }

    /* End Screen Celebration */
    .end-screen {
      display: none;
      text-align: center;
      padding: 24px 8px;
    }

    .end-screen.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .trophy-icon {
      font-size: 4.5rem;
      margin-bottom: 12px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .celebrate-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #3730a3;
      margin-bottom: 8px;
    }

    .celebrate-subtitle {
      font-size: 1.05rem;
      color: #475569;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .final-score-pill {
      display: inline-block;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      color: #b45309;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 24px;
    }

    .restart-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      color: #ffffff;
      border: none;
      border-bottom: 6px solid #3730a3;
      padding: 16px;
      border-radius: 18px;
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
      transition: all 0.15s ease;
    }

    .restart-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Floating Confetti Effect -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">

    <!-- Active Game Screen -->
    <div id="game-view" style="width: 100%;">

      <!-- Header & Score Bar -->
      <div class="header">
        <div class="badge" id="score-badge">
          <span>⭐ 0 / 10</span>
        </div>
      </div>

      <!-- Question Progress -->
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- Vertical Column Math Question Stage -->
      <div class="column-stage" id="column-stage">
        <!-- Rendered dynamically with carry box & individual digit boxes -->
      </div>

      <!-- Check Answer Button (native Android num keypad submit) -->
      <button class="check-answer-btn" id="check-answer-btn">
        <span>✓ Check Answer</span>
      </button>

      <!-- Step-by-Step Explanation Banner (Stops here on wrong answer!) -->
      <div class="explanation-card" id="explanation-card">
        <div class="explanation-title" id="explanation-title">
          <span>💡 Explanation</span>
        </div>
        <div class="explanation-steps" id="explanation-steps">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Next Question Button (Appears on wrong answer to review until pressed) -->
      <div class="next-btn-wrap" id="next-btn-wrap">
        <button class="next-action-btn" id="next-action-btn">
          <span>Next Question</span> ➔
        </button>
      </div>

      <!-- Bottom Parameter Controls (Collapsible, collapsed by default) -->
      <details class="settings-collapse" id="settings-collapse">
        <summary class="settings-summary">
          <span>⚙️ Options</span>
          <span class="chevron-icon">▾</span>
        </summary>
        <div class="bottom-settings-card">
          <div class="settings-row-label">Operation</div>
          <div class="mode-pills">
            <button class="mode-tab active" data-mode="add">➕ Add</button>
            <button class="mode-tab" data-mode="sub">➖ Sub</button>
            <button class="mode-tab" data-mode="mixed">🔀 Mixed</button>
          </div>

          <div class="settings-row-label">Numbers</div>
          <div class="digits-pills">
            <button class="digit-tab" data-digits="1-digit">1-Digit</button>
            <button class="digit-tab" data-digits="2-digit">2-Digits</button>
            <button class="digit-tab active" data-digits="mixed">Mixed</button>
          </div>

          <!-- Utilities inside Drawer -->
          <div class="footer-tools">
            <button class="tool-btn" id="sound-btn">
              🔊 Sound
            </button>
            <button class="tool-btn" id="clear-btn">
              🗑️ Clear
            </button>
          </div>
        </div>
      </details>

    </div>

    <!-- Celebration Screen (Shown at round completion) -->
    <div class="end-screen" id="end-screen">
      <div class="trophy-icon" id="final-trophy">🏆</div>
      <h2 class="celebrate-title" id="celebrate-title">Math Champion!</h2>
      <p class="celebrate-subtitle" id="celebrate-subtitle">You finished the math challenge!</p>
      
      <div>
        <div class="final-score-pill" id="final-score">10 / 10</div>
      </div>

      <button class="restart-btn" id="restart-btn">
        <span>Play Again</span> 🔁
      </button>
    </div>

  </div>

  <script>
    // =========================================================================
    // ⚙️ CONFIGURATION & STATE
    // =========================================================================
    let currentMode = 'add';      // 'add', 'sub', or 'mixed'
    let digitSetting = 'mixed';   // '1-digit', '2-digit', or 'mixed'
    const QUESTIONS_PER_ROUND = 10;
    const AUTO_ADVANCE_DELAY = 1200;

    let questionDeck = [];
    let currentIndex = 0;
    let score = 0;
    let isAnsweringBlocked = false;
    let soundEnabled = true;

    // Elements
    const gameView = document.getElementById('game-view');
    const endScreen = document.getElementById('end-screen');
    const scoreBadge = document.getElementById('score-badge');
    const progressBar = document.getElementById('progress-bar');
    const columnStage = document.getElementById('column-stage');
    const checkAnswerBtn = document.getElementById('check-answer-btn');
    const explanationCard = document.getElementById('explanation-card');
    const explanationTitle = document.getElementById('explanation-title');
    const explanationSteps = document.getElementById('explanation-steps');
    const nextBtnWrap = document.getElementById('next-btn-wrap');
    const nextActionBtn = document.getElementById('next-action-btn');
    const modeTabs = document.querySelectorAll('.mode-tab');
    const digitTabs = document.querySelectorAll('.digit-tab');
    const soundBtn = document.getElementById('sound-btn');
    const clearBtn = document.getElementById('clear-btn');
    const restartBtn = document.getElementById('restart-btn');
    const settingsCollapse = document.getElementById('settings-collapse');

    // Force English digits even when Android device locale is Nepali
    function formatEnglish(n) {
      return Number(n).toLocaleString('en-US');
    }

    // Confetti canvas setup
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // =========================================================================
    // 🔊 AUDIO SYNTHESIS
    // =========================================================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      initAudio();
      playTone(523.25, 0.12, 'triangle', 0.2); // C5
      setTimeout(() => playTone(659.25, 0.12, 'triangle', 0.2), 100); // E5
      setTimeout(() => playTone(783.99, 0.3, 'triangle', 0.25), 200); // G5
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      initAudio();
      playTone(349.23, 0.2, 'sawtooth', 0.12);
      setTimeout(() => playTone(277.18, 0.3, 'sawtooth', 0.12), 140);
    }

    function playKeypadTap() {
      if (!soundEnabled) return;
      initAudio();
      playTone(700, 0.04, 'sine', 0.06);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 0.25, 'triangle', 0.25), idx * 110);
      });
    }

    function triggerHaptic(type = 'tap') {
      if ('vibrate' in navigator) {
        try {
          if (type === 'tap') navigator.vibrate(10);
          else if (type === 'success') navigator.vibrate([40, 30, 60]);
          else navigator.vibrate([100, 50, 100]);
        } catch (e) {}
      }
    }

    // =========================================================================
    // 🎊 CONFETTI SYSTEM
    // =========================================================================
    function launchConfetti(count = 35) {
      const colors = ['#6366f1', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() * 200 - 100),
          y: canvas.height * 0.45,
          r: Math.random() * 6 + 4,
          d: Math.random() * 25 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -10 - 4
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.tiltAngle += p.tiltAngleIncremental;
        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.5;
        p.x += Math.sin(p.d);
        p.tilt = Math.sin(p.tiltAngle - (i / 3)) * 15;

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.vx *= 0.98;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + (p.r / 2), p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 2));
        ctx.stroke();

        if (p.y > canvas.height + 20) {
          confettiParticles.splice(i, 1);
        }
      }
      requestAnimationFrame(updateConfetti);
    }
    requestAnimationFrame(updateConfetti);

    // =========================================================================
    // 🧠 QUESTION GENERATION (1 & 2 DIGIT ADDITION / SUBTRACTION)
    // =========================================================================
    function getRandomNumber(type) {
      if (type === '1-digit') {
        return Math.floor(Math.random() * 9) + 1; // 1 to 9
      } else if (type === '2-digit') {
        return Math.floor(Math.random() * 90) + 10; // 10 to 99
      } else {
        // mixed: 50% chance 1-digit, 50% chance 2-digit
        return Math.random() < 0.5 ? (Math.floor(Math.random() * 9) + 1) : (Math.floor(Math.random() * 90) + 10);
      }
    }

    function generateDeck() {
      const deck = [];
      for (let i = 0; i < QUESTIONS_PER_ROUND; i++) {
        // Choose operation
        let op = '+';
        if (currentMode === 'sub') {
          op = '-';
        } else if (currentMode === 'mixed') {
          op = Math.random() < 0.5 ? '+' : '-';
        }

        let a = getRandomNumber(digitSetting);
        let b = getRandomNumber(digitSetting);

        // For subtraction, ensure a >= b so answer is always non-negative
        if (op === '-') {
          if (b > a) {
            [a, b] = [b, a];
          }
        }

        const answer = (op === '+') ? (a + b) : (a - b);
        deck.push({ a, b, op, answer });
      }
      return deck;
    }

    // Generate clear column addition/subtraction pattern with carry/borrow
    function buildExplanationHTML(q, userAnswer) {
      const { a, b, op, answer } = q;
      let columnAscii = '';
      let steps = [];

      if (op === '+') {
        const aOnes = a % 10;
        const aTens = Math.floor(a / 10);
        const bOnes = b % 10;
        const bTens = Math.floor(b / 10);

        const onesSum = aOnes + bOnes;
        const carry = onesSum >= 10 ? 1 : 0;

        // Step 1: Ones column
        if (carry > 0) {
          steps.push(`${aOnes} + ${bOnes} = ${onesSum}, carry 1`);
        } else {
          steps.push(`${aOnes} + ${bOnes} = ${onesSum}`);
        }

        // Step 2: Tens column
        if (aTens > 0 || bTens > 0 || carry > 0) {
          if (carry > 0) {
            const tensSum = aTens + bTens + carry;
            if (bTens > 0) {
              steps.push(`${aTens} + ${bTens} + 1 = ${tensSum}`);
            } else {
              steps.push(`${aTens} + 1 = ${tensSum}`);
            }
          } else {
            const tensSum = aTens + bTens;
            steps.push(`${aTens} + ${bTens} = ${tensSum}`);
          }
        }

        // Column layout formatting
        const maxLen = Math.max(a.toString().length, b.toString().length, answer.toString().length);
        const width = maxLen + 1;

        let carryLine = '';
        if (carry > 0) {
          // Carry 1 positioned directly above the tens column
          const pad = Math.max(0, width - 2);
          carryLine = ' '.repeat(pad) + '<span style="color:#ec4899;font-weight:900">1</span>\n';
        }

        const aLine = a.toString().padStart(width, ' ');
        const bLine = '+' + b.toString().padStart(width - 1, ' ');
        const divider = '-'.repeat(width + 1);
        const ansLine = answer.toString().padStart(width, ' ');

        columnAscii = `${carryLine}${aLine}\n${bLine}\n${divider}\n<span style="color:#16a34a;font-weight:900">${ansLine}</span>`;

      } else {
        // Subtraction
        const aOnes = a % 10;
        const aTens = Math.floor(a / 10);
        const bOnes = b % 10;
        const bTens = Math.floor(b / 10);

        const maxLen = Math.max(a.toString().length, b.toString().length, answer.toString().length);
        const width = maxLen + 1;

        if (aOnes < bOnes) {
          // Borrow required
          const borrowedOnes = aOnes + 10;
          const newTens = aTens - 1;

          steps.push(`Borrow 1 from ${aTens} (${aTens} becomes ${newTens}, ${aOnes} becomes ${borrowedOnes})`);
          steps.push(`${borrowedOnes} - ${bOnes} = ${borrowedOnes - bOnes}`);
          if (newTens > 0 || bTens > 0) {
            steps.push(`${newTens} - ${bTens} = ${newTens - bTens}`);
          }

          const borrowLine = `<span style="color:#ec4899;font-size:0.95rem"> ${newTens} ${borrowedOnes}</span>\n`;
          const aLine = a.toString().padStart(width, ' ');
          const bLine = '-' + b.toString().padStart(width - 1, ' ');
          const divider = '-'.repeat(width + 1);
          const ansLine = answer.toString().padStart(width, ' ');

          columnAscii = `${borrowLine}${aLine}\n${bLine}\n${divider}\n<span style="color:#16a34a;font-weight:900">${ansLine}</span>`;
        } else {
          // No borrow needed
          steps.push(`${aOnes} - ${bOnes} = ${aOnes - bOnes}`);
          if (aTens > 0 || bTens > 0) {
            steps.push(`${aTens} - ${bTens} = ${aTens - bTens}`);
          }

          const aLine = a.toString().padStart(width, ' ');
          const bLine = '-' + b.toString().padStart(width - 1, ' ');
          const divider = '-'.repeat(width + 1);
          const ansLine = answer.toString().padStart(width, ' ');

          columnAscii = `${aLine}\n${bLine}\n${divider}\n<span style="color:#16a34a;font-weight:900">${ansLine}</span>`;
        }
      }

      const stepsHTML = steps.map(s => `<div>👉 <strong>${s}</strong></div>`).join('');

      return `
        <!-- Vertical Column Math Representation -->
        <div style="text-align: center; margin: 4px 0 10px 0;">
          <pre class="column-math-pre">${columnAscii}</pre>
        </div>

        <!-- Step-by-Step Breakdown -->
        <div class="calc-steps-box">
          <div style="color: #4f46e5; font-weight: 800; margin-bottom: 6px;">📝 Step-by-step:</div>
          ${stepsHTML}
        </div>
      `;
    }

    // =========================================================================
    // 🎮 GAMEPLAY FLOW
    // =========================================================================
    function updateHeaderBadge() {
      // Kept clean and minimal - no verbose banner at top
    }

    function startGame() {
      questionDeck = generateDeck();
      currentIndex = 0;
      score = 0;
      isAnsweringBlocked = false;

      gameView.style.display = 'block';
      endScreen.classList.remove('active');
      explanationCard.className = 'explanation-card';
      explanationCard.style.display = 'none';
      nextBtnWrap.classList.remove('show');
      checkAnswerBtn.disabled = false;

      updateHeaderBadge();
      updateScoreDisplay();
      renderQuestion();
    }

    function updateScoreDisplay() {
      scoreBadge.innerHTML = `<span>⭐ ${formatEnglish(score)} / ${formatEnglish(questionDeck.length)}</span>`;
      const progressPercent = (currentIndex / questionDeck.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }

    function renderQuestion() {
      if (currentIndex >= questionDeck.length) {
        showEndCelebration();
        return;
      }

      isAnsweringBlocked = false;
      checkAnswerBtn.disabled = false;

      // Reset panels
      explanationCard.className = 'explanation-card';
      explanationCard.style.display = 'none';
      nextBtnWrap.classList.remove('show');

      const q = questionDeck[currentIndex];
      const aStr = q.a.toString();
      const bStr = q.b.toString();
      const ansStr = q.answer.toString();

      // Number of digit columns needed
      const numDigits = Math.max(aStr.length, bStr.length, ansStr.length, 2);

      // Build Column Math Board HTML
      let html = `<div class="math-column-table" style="grid-template-columns: 38px repeat(${numDigits}, 52px);">`;

      // Row 1: Carry / Borrow Row
      // Op cell
      html += `<div class="col-cell"></div>`;
      // Digit positions from highest down to 0 (ones)
      for (let pos = numDigits - 1; pos >= 0; pos--) {
        if (pos === 1) {
          // Carry box right above tens column (completely blank so it doesn't confuse her)
          const title = q.op === '+' ? 'Carry box' : 'Borrow box';
          html += `
            <div class="col-cell">
              <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" lang="en"
                     class="digit-box carry-box" id="carry-box"
                     title="${title}" autocomplete="off">
            </div>`;
        } else {
          html += `<div class="col-cell"></div>`;
        }
      }

      // Row 2: Operand A (Number 1: X Y)
      html += `<div class="col-cell"></div>`;
      for (let pos = numDigits - 1; pos >= 0; pos--) {
        const charIdx = aStr.length - 1 - pos;
        if (charIdx >= 0 && charIdx < aStr.length) {
          html += `<div class="col-cell"><span class="col-digit">${aStr[charIdx]}</span></div>`;
        } else {
          html += `<div class="col-cell"></div>`;
        }
      }

      // Row 3: Operator & Operand B (Number 2: + P Q)
      html += `<div class="col-cell"><span class="col-op">${q.op}</span></div>`;
      for (let pos = numDigits - 1; pos >= 0; pos--) {
        const charIdx = bStr.length - 1 - pos;
        if (charIdx >= 0 && charIdx < bStr.length) {
          html += `<div class="col-cell"><span class="col-digit">${bStr[charIdx]}</span></div>`;
        } else {
          html += `<div class="col-cell"></div>`;
        }
      }

      // Row 4: Divider Line
      html += `<div class="col-divider"></div>`;

      // Row 5: Answer Digit Boxes (R S or H R S)
      html += `<div class="col-cell"></div>`;
      for (let pos = numDigits - 1; pos >= 0; pos--) {
        if (pos < ansStr.length) {
          html += `
            <div class="col-cell">
              <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" lang="en"
                     class="digit-box ans-box" id="ans-box-${pos}" data-pos="${pos}"
                     autocomplete="off">
            </div>`;
        } else {
          html += `<div class="col-cell"></div>`;
        }
      }

      html += `</div>`;
      columnStage.innerHTML = html;

      // Attach navigation & native keyboard listeners
      setupInputNavigation(ansStr.length);
    }

    function setupInputNavigation(ansLen) {
      const allInputs = Array.from(columnStage.querySelectorAll('input'));
      const ansBoxes = [];
      for (let pos = ansLen - 1; pos >= 0; pos--) {
        const box = document.getElementById('ans-box-' + pos);
        if (box) ansBoxes.push(box);
      }

      allInputs.forEach(input => {
        // Auto select on focus for easy overwriting
        input.addEventListener('focus', () => {
          setTimeout(() => input.select(), 50);
        });

        // Native numeric input handling
        input.addEventListener('input', (e) => {
          playKeypadTap();
          triggerHaptic('tap');

          // Keep only 0-9
          input.value = input.value.replace(/[^0-9]/g, '');
          if (input.value.length > 1) {
            input.value = input.value.slice(-1);
          }

          // Auto-advance right-to-left (Ones -> Tens -> Hundreds)
          if (input.value.length === 1) {
            if (input.classList.contains('ans-box')) {
              const currentPos = parseInt(input.dataset.pos, 10);
              // Move to next higher position (e.g. 0 -> 1 -> 2)
              const nextBox = document.getElementById('ans-box-' + (currentPos + 1));
              if (nextBox) {
                nextBox.focus();
              }
            } else if (input.id === 'carry-box') {
              // If entered carry, jump to tens box
              const tensBox = document.getElementById('ans-box-1') || document.getElementById('ans-box-0');
              if (tensBox) tensBox.focus();
            }
          }
        });

        // Backspace & Enter navigation
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && input.value === '') {
            if (input.classList.contains('ans-box')) {
              const currentPos = parseInt(input.dataset.pos, 10);
              // Move back to lower position (e.g. 2 -> 1 -> 0)
              const prevBox = document.getElementById('ans-box-' + (currentPos - 1));
              if (prevBox) prevBox.focus();
            }
          } else if (e.key === 'Enter') {
            handleSubmitAnswer();
          }
        });
      });

      // Auto-focus the Ones box (ans-box-0) to trigger native Android numeric keyboard
      const onesBox = document.getElementById('ans-box-0');
      if (onesBox) {
        setTimeout(() => {
          onesBox.focus();
        }, 150);
      }
    }

    function handleClear() {
      if (isAnsweringBlocked) return;
      playKeypadTap();
      const allInputs = columnStage.querySelectorAll('input');
      allInputs.forEach(inp => {
        inp.value = '';
        inp.classList.remove('correct', 'wrong');
        inp.disabled = false;
      });
      const onesBox = document.getElementById('ans-box-0');
      if (onesBox) onesBox.focus();
    }

    function handleSubmitAnswer() {
      if (isAnsweringBlocked) return;
      initAudio();

      const q = questionDeck[currentIndex];
      const ansStr = q.answer.toString();
      let enteredValStr = '';
      let hasEmpty = false;
      let firstEmpty = null;

      // Read from highest position (Hundreds) down to position 0 (Ones)
      for (let pos = ansStr.length - 1; pos >= 0; pos--) {
        const box = document.getElementById('ans-box-' + pos);
        if (!box || box.value.trim() === '') {
          hasEmpty = true;
          if (!firstEmpty) firstEmpty = box;
        } else {
          enteredValStr += box.value.trim();
        }
      }

      if (hasEmpty) {
        if (firstEmpty) {
          firstEmpty.style.borderColor = '#f59e0b';
          firstEmpty.focus();
          setTimeout(() => {
            if (!isAnsweringBlocked && firstEmpty) firstEmpty.style.borderColor = '#6366f1';
          }, 500);
        }
        return;
      }

      const parsedVal = parseInt(enteredValStr, 10);
      const isCorrect = (parsedVal === q.answer);

      isAnsweringBlocked = true;
      checkAnswerBtn.disabled = true;
      const allInputs = columnStage.querySelectorAll('input');
      allInputs.forEach(inp => inp.disabled = true);

      if (isCorrect) {
        // ✅ CORRECT PATH:
        score++;
        playCorrectSound();
        triggerHaptic('success');
        launchConfetti(25);

        const ansBoxes = columnStage.querySelectorAll('.ans-box');
        ansBoxes.forEach(b => b.classList.add('correct'));

        const carryBox = document.getElementById('carry-box');
        if (carryBox && carryBox.value) carryBox.classList.add('correct');

        explanationTitle.innerHTML = '<span>🌟 Outstanding! That is correct!</span>';
        explanationSteps.innerHTML = `<div style="font-size:1.3rem;text-align:center;font-weight:900;color:#15803d">${q.a} ${q.op} ${q.b} = ${q.answer} 🎉</div>`;
        explanationCard.style.display = 'block';
        explanationCard.className = 'explanation-card show correct';

        // Auto-proceed to next question without pressing next!
        setTimeout(() => {
          currentIndex++;
          updateScoreDisplay();
          renderQuestion();
        }, AUTO_ADVANCE_DELAY);
      } else {
        // 🛑 WRONG PATH:
        playWrongSound();
        triggerHaptic('wrong');

        const ansBoxes = columnStage.querySelectorAll('.ans-box');
        ansBoxes.forEach(b => b.classList.add('wrong'));

        // Show column breakdown
        explanationTitle.innerHTML = `<span>💡 Solution: ${formatEnglish(q.a)} ${q.op} ${formatEnglish(q.b)} = ${formatEnglish(q.answer)}</span>`;
        explanationSteps.innerHTML = buildExplanationHTML(q, enteredValStr);
        explanationCard.style.display = 'block';
        explanationCard.className = 'explanation-card show wrong';

        // Stop here! Display Next button so she can review the explanation at her own pace
        nextBtnWrap.classList.add('show');
      }
    }

    function showEndCelebration() {
      progressBar.style.width = '100%';
      gameView.style.display = 'none';
      endScreen.classList.add('active');

      const total = questionDeck.length;
      document.getElementById('final-score').textContent = `${formatEnglish(score)} / ${formatEnglish(total)}`;

      const title = document.getElementById('celebrate-title');
      const subtitle = document.getElementById('celebrate-subtitle');
      const trophy = document.getElementById('final-trophy');

      if (score === total) {
        trophy.textContent = '🏆';
        title.textContent = 'Math Wizard!';
        subtitle.textContent = `A perfect 10/10! You mastered every problem! 🚀`;
        launchConfetti(70);
      } else if (score >= total * 0.7) {
        trophy.textContent = '⭐';
        title.textContent = 'Awesome Job!';
        subtitle.textContent = `High score! Keep up the brilliant practicing!`;
        launchConfetti(45);
      } else {
        trophy.textContent = '🌱';
        title.textContent = 'Great Effort!';
        subtitle.textContent = `Every mistake helps your brain grow stronger. Try again for 10/10!`;
      }

      playWinSound();
    }

    // =========================================================================
    // ⚙️ EVENT LISTENERS & CONTROLS
    // =========================================================================
    // Check answer button (submits answer from native Android numpad inputs)
    checkAnswerBtn.addEventListener('click', handleSubmitAnswer);

    // Physical keyboard support for desktop
    window.addEventListener('keydown', (e) => {
      if (gameView.style.display === 'none') return;

      if (e.key === 'Enter') {
        if (nextBtnWrap.classList.contains('show')) {
          // If next button is visible on error review, Enter triggers next question!
          nextActionBtn.click();
        } else {
          handleSubmitAnswer();
        }
      } else if (e.key === 'Escape') {
        handleClear();
      }
    });

    // Next question action on error review
    nextActionBtn.addEventListener('click', () => {
      initAudio();
      nextBtnWrap.classList.remove('show');
      currentIndex++;
      updateScoreDisplay();
      renderQuestion();
    });

    // Mode tabs (Addition / Subtraction / Mixed)
    modeTabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        initAudio();
        modeTabs.forEach(t => t.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentMode = e.currentTarget.dataset.mode;
        startGame();
      });
    });

    // Digit tabs (1-Digit / 2-Digits / Mixed)
    digitTabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        initAudio();
        digitTabs.forEach(t => t.classList.remove('active'));
        e.currentTarget.classList.add('active');
        digitSetting = e.currentTarget.dataset.digits;
        startGame();
      });
    });

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
      if (soundEnabled) initAudio();
    });

    clearBtn.addEventListener('click', handleClear);

    restartBtn.addEventListener('click', () => {
      initAudio();
      startGame();
    });

    // Initialize game on load
    window.addEventListener('DOMContentLoaded', startGame);
  </script>
</body>
